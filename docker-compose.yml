services:
  backend:
    build: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/photolib.db
      - Storage__PhotosPath=/data/uploads/photos
      - Storage__AvatarsPath=/data/uploads/avatars
      # Optional - only needed for the "Generate with AI" photo-description
      # feature. Leave unset to run everything else without it.
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      # Hard kill switch for the AI endpoint, independent of whether a key
      # is set - set to false to disable it outright on a shared instance.
      - Ai__Enabled=${AI_ENABLED:-true}
      # Required to create accounts - see .env.example for details.
      - Auth__AdminKey=${AUTH_ADMIN_KEY:-}
    volumes:
      - photolib-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Periodically snapshots the database and uploaded photos to ./backups on
  # the host (not just a Docker volume) so a bad migration, accidental
  # delete, or volume corruption doesn't mean total data loss. This alone
  # isn't a full disaster-recovery plan - copy ./backups somewhere off this
  # machine periodically for real protection.
  backup:
    build: ./backup
    environment:
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      # Not mounted read-only: sqlite3's backup command needs to create a
      # transient lock/journal file alongside the source database even for
      # a read-only snapshot - a read-only mount makes that fail outright.
      - photolib-data:/data
      - ./backups:/backups
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  photolib-data:
