<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal settings-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ "settings.heading" | t }}</h2>
      <button class="modal-close" (click)="close.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="settings-section" *ngIf="authService.currentUser as user">
        <div class="settings-label">{{ "settings.account" | t }}</div>
        <div class="settings-account-row">
          <span class="settings-account-email">{{ user.email }}</span>
          <button class="btn secondary" (click)="logout.emit()">
            {{ "auth.logout" | t }}
          </button>
        </div>

        <button
          class="btn link change-password-toggle"
          (click)="toggleChangePassword()"
        >
          {{ (showChangePassword ? "common.cancel" : "auth.changePassword") | t }}
        </button>

        <form
          class="change-password-form"
          *ngIf="showChangePassword"
          (ngSubmit)="submitChangePassword()"
        >
          <div class="form-field">
            <label for="current-password">{{ "auth.currentPassword" | t }}</label>
            <input
              id="current-password"
              type="password"
              autocomplete="current-password"
              [(ngModel)]="currentPassword"
              name="currentPassword"
              [disabled]="isChangingPassword"
              required
            />
          </div>

          <div class="form-field">
            <label for="new-password">{{ "auth.newPassword" | t }}</label>
            <input
              id="new-password"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="newPassword"
              name="newPassword"
              [disabled]="isChangingPassword"
              minlength="8"
              required
            />
            <span class="form-hint">{{ "auth.passwordHint" | t }}</span>
          </div>

          <div class="form-error" *ngIf="changePasswordError">
            {{ changePasswordError | t }}
          </div>
          <div class="form-success" *ngIf="changePasswordSuccess">
            {{ "auth.passwordChanged" | t }}
          </div>

          <button
            type="submit"
            class="btn primary"
            [disabled]="isChangingPassword || !currentPassword || !newPassword"
          >
            <span class="btn-spinner" *ngIf="isChangingPassword"></span>
            {{ (isChangingPassword ? "auth.changingPassword" : "auth.changePassword") | t }}
          </button>
        </form>
      </div>

      <div class="settings-section">
        <div class="settings-label">{{ "settings.language" | t }}</div>
        <div class="settings-options">
          <button
            class="settings-option"
            [class.active]="i18n.lang === 'be'"
            (click)="setLang('be')"
          >
            {{ "settings.languageBe" | t }}
          </button>
          <button
            class="settings-option"
            [class.active]="i18n.lang === 'en'"
            (click)="setLang('en')"
          >
            {{ "settings.languageEn" | t }}
          </button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">{{ "settings.theme" | t }}</div>
        <div class="theme-options">
          <button
            class="theme-option"
            *ngFor="let th of themeIds; trackBy: trackByThemeId"
            [class.active]="theme.theme === th"
            (click)="setTheme(th)"
          >
            <span class="theme-swatch">
              <span
                class="theme-swatch-half"
                [style.background]="previewCanvas(th)"
              ></span>
              <span
                class="theme-swatch-half"
                [style.background]="previewElevated(th)"
              ></span>
            </span>
            <span>{{ themeLabelKey(th) | t }}</span>
          </button>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn primary" (click)="close.emit()">
        {{ "common.close" | t }}
      </button>
    </div>
  </div>
</div>
