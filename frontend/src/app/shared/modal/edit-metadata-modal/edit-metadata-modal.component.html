<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ heading | t }}</h2>
      <button class="modal-close" (click)="close.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-field">
        <label for="edit-title">{{ "editMetadata.title" | t }}</label>
        <input
          id="edit-title"
          type="text"
          [placeholder]="'editMetadata.title' | t"
          [value]="title"
          (input)="title = $any($event.target).value"
        />
      </div>

      <div class="form-field">
        <label for="edit-description">{{ "editMetadata.description" | t }}</label>
        <textarea
          id="edit-description"
          rows="4"
          [placeholder]="'editMetadata.description' | t"
          (input)="description = $any($event.target).value"
          >{{ description }}</textarea
        >
      </div>

      <div class="form-field">
        <label for="edit-tags">{{ "editMetadata.tags" | t }}</label>
        <input
          id="edit-tags"
          type="text"
          [placeholder]="'editMetadata.tagsPlaceholder' | t"
          list="edit-tag-options"
          [(ngModel)]="tagsText"
        />
        <datalist id="edit-tag-options">
          <option *ngFor="let t of availableTags" [value]="t"></option>
        </datalist>
      </div>
    </div>

    <div class="form-error" *ngIf="saveError">{{ saveError }}</div>

    <div class="modal-footer" appButtonGroupNav>
      <button class="btn secondary" (click)="close.emit()">{{ "common.cancel" | t }}</button>
      <button
        class="btn primary"
        [disabled]="isSaving || !isDirty"
        (click)="onSave()"
      >
        {{ (isSaving ? "common.saving" : "common.save") | t }}
      </button>
    </div>
  </div>
</div>
