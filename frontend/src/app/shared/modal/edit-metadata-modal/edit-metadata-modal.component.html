<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ heading }}</h2>
      <button class="modal-close" (click)="close.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-field">
        <label for="edit-title">Title</label>
        <input
          id="edit-title"
          type="text"
          placeholder="Title"
          [value]="title"
          (input)="title = $any($event.target).value"
        />
      </div>

      <div class="form-field">
        <label for="edit-description">Description</label>
        <textarea
          id="edit-description"
          rows="4"
          placeholder="Description"
          (input)="description = $any($event.target).value"
          >{{ description }}</textarea
        >
      </div>

      <div class="form-field">
        <label for="edit-tags">Tags</label>
        <input
          id="edit-tags"
          type="text"
          placeholder="e.g. ships, vintage"
          list="edit-tag-options"
          [(ngModel)]="tagsText"
        />
        <datalist id="edit-tag-options">
          <option *ngFor="let t of availableTags" [value]="t"></option>
        </datalist>
      </div>
    </div>

    <div class="form-error" *ngIf="saveError">{{ saveError }}</div>

    <div class="modal-footer" appButtonGroupNav>
      <button class="btn secondary" (click)="close.emit()">Cancel</button>
      <button
        class="btn primary"
        [disabled]="isSaving || !isDirty"
        (click)="onSave()"
      >
        {{ isSaving ? "Saving…" : "Save" }}
      </button>
    </div>
  </div>
</div>
