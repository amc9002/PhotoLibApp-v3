<app-gallery-view
  [gallery]="gallery"
  (photoSelected)="openViewer($event)"
  (photosLoaded)="onPhotosLoaded($event)"
  (singleNewPhotoDetected)="openViewer($event, true)"
  (editPhotoRequest)="openEditMetadataFor($event)"
  (showPhotoInfoRequest)="showPhotoInfoFor($event)"
  (copyPhotoRequest)="requestCopyOrMove([$event], 'copy')"
  (movePhotoRequest)="requestCopyOrMove([$event], 'move')"
  (deletePhotoRequest)="openDeleteConfirm($event)"
></app-gallery-view>

<app-photo-viewer
  *ngIf="viewerOpen && viewerPhotoId"
  [photos]="photos"
  [activePhotoId]="viewerPhotoId"
  [openEditOnLoad]="viewerAutoEdit"
  [slideshowConfig]="activeSlideshowConfig"
  (close)="closeViewer()"
  (photoSelected)="openViewer($event)"
  (requestDelete)="openDeleteConfirm($event)"
  (requestCopy)="requestCopyOrMove([$event], 'copy')"
  (requestMove)="requestCopyOrMove([$event], 'move')"
></app-photo-viewer>

<app-slideshow-settings-modal
  *ngIf="slideshowSettingsOpen"
  (start)="startSlideshow($event)"
  (cancel)="closeSlideshowSettings()"
></app-slideshow-settings-modal>

<app-confirm-modal
  *ngIf="deleteConfirmOpen"
  [title]="'galleryPage.deletePhotoTitle' | t"
  [message]="deleteConfirmMessage"
  [confirmText]="'common.delete' | t"
  [isBusy]="isDeletingPhoto"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteConfirm()"
></app-confirm-modal>

<app-gallery-select-modal
  *ngIf="gallerySelectOpen"
  [mode]="gallerySelectMode"
  [galleries]="otherGalleries"
  [count]="photoIdsToMoveOrCopy.length"
  [isBusy]="isMovingOrCopying"
  (selectExisting)="onGallerySelected($event)"
  (createNew)="onCreateGalleryForMoveOrCopy($event)"
  (cancel)="closeGallerySelect()"
></app-gallery-select-modal>

<app-edit-metadata-modal
  *ngIf="metadataEditing.editOpen && contextEditPhoto as photo"
  heading="photoViewer.editDetails"
  [photoId]="photo.id"
  [title]="photo.title"
  [description]="photo.description ?? ''"
  [tags]="photo.tags"
  [isSaving]="metadataEditing.isSaving"
  [saveError]="metadataEditing.saveError ? (metadataEditing.saveError | t) : null"
  (save)="onSaveMetadata($event)"
  (close)="metadataEditing.closeEdit()"
></app-edit-metadata-modal>

<app-photo-info-modal
  *ngIf="metadataEditing.infoOpen && metadataEditing.infoPhoto as infoPhoto"
  [photo]="infoPhoto"
  (close)="metadataEditing.closeInfo()"
></app-photo-info-modal>
