<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="modal-close" (click)="cancel.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="gallery-picker-list">
        <div
          *ngFor="let g of galleries; trackBy: trackById"
          class="gallery-picker-item"
          (click)="pick(g.id)"
        >
          {{ g.title }}
        </div>

        <div *ngIf="galleries.length === 0" class="gallery-picker-empty">
          {{ "gallerySelect.noOtherGalleries" | t }}
        </div>
      </div>

      <div class="gallery-picker-new">
        <input
          type="text"
          [placeholder]="'gallerySelect.newGalleryPlaceholder' | t"
          [(ngModel)]="newTitle"
          (keyup.enter)="submitNew()"
        />
        <button
          class="btn secondary"
          [disabled]="!newTitle.trim() || isBusy"
          (click)="submitNew()"
        >
          {{ isBusy ? ("common.working" | t) : (("common.create" | t) + " & " + actionLabel) }}
        </button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn secondary" (click)="cancel.emit()">{{ "common.cancel" | t }}</button>
    </div>
  </div>
</div>
