<!-- LEFT TOOLBAR -->
<ng-container *ngIf="layout === 'left'">
  <button
    class="toolbar-btn gallery-btn"
    (click)="toggleDropdown(); $event.stopPropagation()"
  >
    Галерэя ▼
  </button>
  <div class="dropdown" *ngIf="dropdownOpen">
    <div class="dropdown-item" *ngFor="let g of galleries" (click)="select(g)">
      {{ g.title }}
    </div>

    <div *ngIf="galleries.length === 0" class="dropdown-empty">
      No galleries
    </div>
  </div>

  <span
    class="gallery-title"
    *ngIf="selectedGallery"
    title="{{ selectedGallery.title }}"
  >
    {{ selectedGallery.title }}
  </span>
</ng-container>

<!-- RIGHT TOOLBAR -->
<ng-container *ngIf="layout === 'right'">
  <button
    class="toolbar-btn"
    [disabled]="!thumbnailSize.canIncrease"
    (click)="thumbnailSize.increase()"
    title="Increase thumbnail size"
  >
    ➕
  </button>
  <button
    class="toolbar-btn"
    [disabled]="!thumbnailSize.canDecrease"
    (click)="thumbnailSize.decrease()"
    title="Decrease thumbnail size"
  >
    ➖
  </button>

  <div class="service-menu-wrapper">
    <button
      class="toolbar-btn"
      (click)="toggleServiceMenu(); $event.stopPropagation()"
    >
      ⋮
    </button>

    <div class="service-menu" *ngIf="serviceMenuOpen">
      <ng-container *ngIf="photoSelection.count > 0">
        <div class="service-menu-label">
          {{ photoSelection.count }} photo{{
            photoSelection.count > 1 ? "s" : ""
          }}
          selected
        </div>

        <div
          class="service-menu-item"
          (click)="onCopySelected(); $event.stopPropagation()"
        >
          Copy selected to gallery
        </div>

        <div
          class="service-menu-item"
          (click)="onMoveSelected(); $event.stopPropagation()"
        >
          Move selected to gallery
        </div>

        <div
          class="service-menu-item danger"
          (click)="onDeleteSelected(); $event.stopPropagation()"
        >
          Delete selected
        </div>

        <div class="service-menu-divider"></div>
      </ng-container>

      <div
        class="service-menu-item"
        (click)="onAddPhotos(); $event.stopPropagation()"
      >
        Add photos
      </div>

      <div
        class="service-menu-item"
        (click)="onNewGallery(); $event.stopPropagation()"
      >
        New gallery
      </div>

      <div
        class="service-menu-item"
        (click)="closeServiceMenu(); properties.emit()"
      >
        Gallery properties
      </div>

      <div
        class="service-menu-item"
        (click)="onEditGallery(); $event.stopPropagation()"
      >
        Edit gallery
      </div>

      <div
        class="service-menu-item danger"
        (click)="onDeleteGallery(); $event.stopPropagation()"
      >
        Delete gallery
      </div>
    </div>
  </div>
</ng-container>
