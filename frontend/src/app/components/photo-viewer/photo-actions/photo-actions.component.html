<!--
  IMPORTANT:
  stopPropagation is required to prevent viewer backdrop click
-->
<div class="photo-actions" (click)="$event.stopPropagation()">
  <button
    class="photo-action-btn"
    [attr.aria-label]="'photoActions.menuLabel' | t"
    (click)="toggleMenu(); $event.stopPropagation()"
  >
    ⋮
  </button>

  <div class="photo-action-menu" *ngIf="menuOpen">
    <button
      class="photo-action-item"
      (click)="onEditMetadataClick(); $event.stopPropagation()"
    >
      {{ "photoActions.editInfo" | t }}
    </button>

    <button
      class="photo-action-item"
      (click)="onShowInfoClick(); $event.stopPropagation()"
    >
      {{ "photoActions.photoInfo" | t }}
    </button>

    <button
      class="photo-action-item"
      (click)="onCopyClick(); $event.stopPropagation()"
    >
      {{ "photoActions.copyToGallery" | t }}
    </button>

    <button
      class="photo-action-item"
      (click)="onMoveClick(); $event.stopPropagation()"
    >
      {{ "photoActions.moveToGallery" | t }}
    </button>

    <button
      class="photo-action-item danger"
      (click)="onDeleteClick(); $event.stopPropagation()"
    >
      {{ "photoActions.deletePhoto" | t }}
    </button>
  </div>
</div>
