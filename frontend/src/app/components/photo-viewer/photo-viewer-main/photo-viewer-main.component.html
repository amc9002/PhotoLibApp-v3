<div class="photo-viewer-main">
  <img
    *ngIf="previousLayer as p"
    class="photo-below"
    [class.fading-out]="fadingOut"
    [src]="p.url"
    alt="Photo"
  />
  <img
    *ngFor="let c of currentLayerList; trackBy: trackByLayerId"
    [src]="c.url"
    [class.open]="open"
    [class.crossfade]="crossfade"
    [class.crossfade-in]="crossfade && fadingIn"
    alt="Photo"
  />
</div>
