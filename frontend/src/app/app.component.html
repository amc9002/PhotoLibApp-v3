<header class="app-header">
  <div class="header-left">
    <span class="app-title">PhotoLib</span>

    <app-toolbar
      [galleries]="galleries"
      [selectedGallery]="selectedGallery"
      (gallerySelected)="selectGallery($event)"
    ></app-toolbar>
  </div>

  <div class="header-right">
    <app-toolbar
      layout="right"
      [selectedGallery]="selectedGallery"
      (newGallery)="openCreateGallery()"
      (addPhotos)="openFilePicker()"
      (addFromInternet)="openAddFromInternet()"
      (properties)="openGalleryProperties()"
      (deleteGallery)="openDeleteGalleryConfirm()"
      (editGallery)="openEditGallery()"
      (copySelected)="onCopySelected()"
      (moveSelected)="onMoveSelected()"
      (deleteSelected)="onDeleteSelected()"
    ></app-toolbar>
    <app-gallery-properties
      *ngIf="showGalleryProperties && selectedGallery"
      [gallery]="selectedGallery"
      (close)="closeGalleryProperties()"
    ></app-gallery-properties>
  </div>
</header>

<main class="app-content">
  <app-gallery-page
    *ngIf="selectedGallery"
    [gallery]="selectedGallery"
    [allGalleries]="galleries"
    (galleryEmptied)="onGalleryEmptied()"
    (galleryCreated)="onGalleryCreatedElsewhere($event)"
  ></app-gallery-page>

  <div *ngIf="!selectedGallery" class="empty-state">
    Select a gallery to view photos
  </div>
</main>

<input
  #fileInput
  type="file"
  multiple
  accept="image/*"
  class="hidden-file-input"
  aria-label="Add photos to gallery"
  (change)="onFilesSelected($event)"
/>

<app-create-gallery
  *ngIf="showCreateGallery"
  (create)="createGallery($event)"
  (cancel)="closeCreateGallery()"
></app-create-gallery>

<app-confirm-modal
  *ngIf="deleteGalleryConfirmOpen"
  [title]="deleteGalleryTitle"
  [message]="deleteGalleryMessage"
  confirmText="Delete"
  [isBusy]="isDeletingGallery"
  (confirm)="confirmDeleteGallery()"
  (cancel)="closeDeleteGalleryConfirm()"
></app-confirm-modal>

<app-edit-metadata-modal
  *ngIf="editGalleryOpen && selectedGallery"
  heading="Edit gallery"
  [title]="selectedGallery.title"
  [description]="selectedGallery.description ?? ''"
  [tags]="selectedGallery.tags"
  [isSaving]="isSavingGallery"
  [saveError]="gallerySaveError"
  (save)="saveGalleryEdit($event)"
  (close)="closeEditGallery()"
></app-edit-metadata-modal>

<app-add-from-internet-modal
  *ngIf="showAddFromInternet && selectedGallery"
  [galleryId]="selectedGallery.id"
  [galleryTitle]="selectedGallery.title"
  (close)="closeAddFromInternet()"
></app-add-from-internet-modal>
